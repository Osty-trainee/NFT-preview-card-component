<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/main.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
  <main class="card">
    <div class="card__image-container">
      <img src="./images/image-equilibrium.jpg" alt="Equilibrium NFT on the blue" class="card__main-image">
      <div class="card__overlay">
        <img src="./images/icon-view.svg" alt="View icon (eye)">
      </div>
    </div>

    <h1 class="title">Equilibrium #3429</h1>
    <p class="description">Our Equilibrium collection promotes balance and calm.</p>

    <div class="info-status">
      <div class="info-status__price">
        <img src="./images/icon-ethereum.svg" alt="Ethereum icon">
        <span>0.041 ETH</span>
      </div>
      <div class="info-status__time">
        <img src="./images/icon-clock.svg" alt="Clock icon">
        <span>3 days left</span>
      </div>
    </div>

    <div class="creator">
      <img src="./images/image-avatar.png" alt="Avator creator of Jules Wyvern" class="avatar">
      <p class="creator__text">Creation of <span class="creator__name">Jules Wyvern</span></p>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/Osty-trainee">Osty</a>.
  </footer>
</body>
</html>
